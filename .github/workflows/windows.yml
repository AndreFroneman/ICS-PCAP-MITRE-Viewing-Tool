name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
      - name: Run the test suite
        run: npm test
      - name: Stage TShark without Npcap
        shell: pwsh
        run: ./scripts/stage-tshark.ps1
      - name: Refuse a Suricata binary that was not reviewed
        shell: pwsh
        run: |
          $found = Get-ChildItem -Recurse src-tauri/resources/engines -Include suricata.exe,wpcap.dll,npcap*.exe -ErrorAction SilentlyContinue
          if ($found) { throw "Refusing to bundle Suricata or Npcap. See docs/ENGINES.md." }
          if (-not (Test-Path src-tauri/resources/suricata/suricata.yaml)) { throw "Offline Suricata config is missing." }
          if (-not (Test-Path src-tauri/resources/rules/README.md)) { throw "Rules notice is missing." }
      # tauri-action calls `npm run tauri build`, so package.json must keep a "tauri" script.
      - name: Build the per-user NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --bundles nsis
      - name: Collect the installer, the documentation, and checksums
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer was not produced" }
          Copy-Item $exe.FullName "Primer_2.0.0_x64-setup.exe"
          Compress-Archive -Path README.md, CHANGELOG.md, LICENSE, THIRD_PARTY_NOTICES.md, docs -DestinationPath "Primer_2.0.0_docs.zip" -Force
          Copy-Item src-tauri/target/wireshark-4.6.9.tar.xz "wireshark-4.6.9.tar.xz"
          $lines = foreach ($f in "Primer_2.0.0_x64-setup.exe", "Primer_2.0.0_docs.zip", "wireshark-4.6.9.tar.xz") {
            "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $f
          }
          $lines | Set-Content -Encoding ascii "SHA256SUMS.txt"
          Get-Content SHA256SUMS.txt
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Primer_2.0.0_x64-setup
          path: |
            Primer_2.0.0_x64-setup.exe
            Primer_2.0.0_docs.zip
            SHA256SUMS.txt
            wireshark-4.6.9.tar.xz
          if-no-files-found: error
      - name: Attach the installer, documentation, and matching Wireshark source to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Primer 2.0.0
          fail_on_unmatched_files: true
          files: |
            Primer_2.0.0_x64-setup.exe
            Primer_2.0.0_docs.zip
            SHA256SUMS.txt
            wireshark-4.6.9.tar.xz
          body: |
            Primer 2.0.0 for 64-bit Windows 10 and 11: network captures, explained for humans, with industrial protocols and MITRE ATT&CK for Enterprise and ICS.

            ## Files

            | File | What it is |
            | --- | --- |
            | `Primer_2.0.0_x64-setup.exe` | The installer. One per-user NSIS package with the WebView2 offline runtime embedded, so an air-gapped Windows 10 PC does not download it. |
            | `Primer_2.0.0_docs.zip` | The documentation: README, user guide, engines notes, test results, changelog, licence, and third-party notices. |
            | `SHA256SUMS.txt` | SHA-256 of every file on this release. |
            | `wireshark-4.6.9.tar.xz` | The source that matches the bundled TShark 4.6.9 (GPL source offer). |

            ## Install

            1. Download `Primer_2.0.0_x64-setup.exe`.
            2. Optional: check it in PowerShell with `Get-FileHash .\Primer_2.0.0_x64-setup.exe` and compare with `SHA256SUMS.txt`.
            3. Run it. The installer is not code-signed, so SmartScreen will say it is unrecognised. Choose **More info**, then **Run anyway**.
            4. Open a `.pcap` or `.pcapng`, or start with the **Plant shift** sample.

            Offline analysis does not need an administrator. TShark 4.6.9 is included as a separate program. Npcap is not included. Suricata is not included. Live capture is optional and needs Npcap, which you install yourself from https://npcap.com/#download.

            ## Documentation

            - User guide: https://github.com/AndreFroneman/ICS-PCAP-MITRE-Viewing-Tool/blob/v2.0.0/docs/USER_GUIDE.md
            - Engines (TShark, Suricata, Npcap, WebView2): https://github.com/AndreFroneman/ICS-PCAP-MITRE-Viewing-Tool/blob/v2.0.0/docs/ENGINES.md
            - Changelog: https://github.com/AndreFroneman/ICS-PCAP-MITRE-Viewing-Tool/blob/v2.0.0/CHANGELOG.md
            - Third-party notices: https://github.com/AndreFroneman/ICS-PCAP-MITRE-Viewing-Tool/blob/v2.0.0/THIRD_PARTY_NOTICES.md

            Primer is free software under GPL-2.0-or-later. It is an analysis aid: a packet capture cannot prove that a controller was exploited.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
