name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the Primer version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if (-not $version) { throw "No version in src-tauri/tauri.conf.json" }
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkg -ne $version) { throw "package.json is $pkg but tauri.conf.json is $version" }
          if ("${{ github.ref }}".StartsWith("refs/tags/v") -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match version $version"
          }
          "PRIMER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building Primer $version"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
      - name: Run the test suite
        run: npm test
      - name: Stage TShark without Npcap
        shell: pwsh
        run: ./scripts/stage-tshark.ps1
      - name: Refuse a Suricata binary that was not reviewed
        shell: pwsh
        run: |
          $found = Get-ChildItem -Recurse src-tauri/resources/engines -Include suricata.exe,wpcap.dll,npcap*.exe -ErrorAction SilentlyContinue
          if ($found) { throw "Refusing to bundle Suricata or Npcap. See docs/ENGINES.md." }
          if (-not (Test-Path src-tauri/resources/suricata/suricata.yaml)) { throw "Offline Suricata config is missing." }
          if (-not (Test-Path src-tauri/resources/rules/README.md)) { throw "Rules notice is missing." }
      # tauri-action calls `npm run tauri build`, so package.json must keep a "tauri" script.
      - name: Build the per-user NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --bundles nsis
      - name: Collect the release files
        shell: pwsh
        run: |
          $v = $env:PRIMER_VERSION
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer was not produced" }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $exe.FullName "release/Primer_${v}_x64-setup.exe"
          Copy-Item README.md "release/README.md"
          Copy-Item LICENSE "release/GPL-2.0-LICENSE.txt"
          Get-ChildItem release | ForEach-Object { "{0}  {1}  {2:N0} bytes" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name, $_.Length }
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Primer_${{ env.PRIMER_VERSION }}_x64-setup
          path: release/
          if-no-files-found: error
      # On a v* tag the release page is rebuilt with exactly three files: the installer,
      # README.md, and the GPL licence. Older releases are then removed so only the newest
      # version is listed. Their git tags are kept, so every version's source stays reachable.
      - name: Publish the release (installer, README, GPL licence)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $v = $env:PRIMER_VERSION
          $tag = "${{ github.ref_name }}"
          $notes = @'
          Primer {VERSION} for 64-bit Windows 10 and 11.

          - **Primer_{VERSION}_x64-setup.exe**: the installer. Download it and run it.
          - **README.md**: how to install and use Primer.
          - **GPL-2.0-LICENSE.txt**: the licence. Primer is free software under GPL-2.0-or-later.

          The installer is not code-signed. If Windows SmartScreen warns you, choose **More info**, then **Run anyway**.
          '@
          $notes.Replace('{VERSION}', $v) | Set-Content -Encoding utf8 release-notes.md
          $existing = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw "Could not list releases" }
          if ($existing -contains $tag) {
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not replace the existing $tag release" }
          }
          gh release create $tag "release/Primer_${v}_x64-setup.exe" "release/README.md" "release/GPL-2.0-LICENSE.txt" --title "Primer $v" --notes-file release-notes.md --latest --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "Could not create the $tag release" }
          foreach ($old in $existing | Where-Object { $_ -and $_ -ne $tag }) {
            Write-Host "Removing older release $old (its tag is kept)"
            gh release delete $old --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not remove release $old" }
          }
          gh release view $tag --json "name,assets" --jq '.name, (.assets[] | .name)'
