[package]
name = "primer"
version = "2.0.0"
description = "Primer packet capture investigation tool"
authors = ["Andre Froneman"]
edition = "2021"

[lib]
name = "primer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
