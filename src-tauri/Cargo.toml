[package]
name = "primer"
version = "1.0.1"
description = "Primer packet capture analyser"
authors = ["Horizon"]
edition = "2021"

[lib]
name = "primer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
